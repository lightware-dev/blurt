# blurtd — Parakeet dictation daemon.
#
#   docker compose up --build       # v3 multilingual on :25878
#
# Needs the NVIDIA Container Toolkit on the host (`--gpus all` equivalent).
services:
  blurtd:
    build: .
    image: blurtd
    container_name: blurtd
    ports:
      - "25878:25878"
      # Wyoming protocol (Home Assistant STT) — disabled by default. To use it,
      # set WYOMING_PORT: "10300" below and uncomment this mapping. That port has
      # no auth and no TLS (AUTH_TOKEN does not apply to it), so only expose it
      # on a network you trust.
      # - "10300:10300"
    volumes:
      # Persists HuggingFace/NeMo model downloads *and* the auto-generated
      # self-signed TLS cert across restarts.
      - blurt-cache:/root/.cache
      # Serves wss:// out of the box via an auto-generated cert. Mount your own
      # here to override it (see scripts/gen_certs.sh):
      # - ./certs:/app/certs:ro
    environment:
      # See .env.example for the full list. A few common ones:
      # AUTH_TOKEN: changeme    # require ?token=… on the ws connection
      # BLURT_AUTOCERT: "0"     # disable the auto cert, fall back to plain ws://
      # LOG_STATS: "0"          # silence per-dictation stats (packets/bytes/duration)
      HOST: 0.0.0.0
      PORT: "25878"
      # WYOMING_PORT: "10300"   # enable the Wyoming (Home Assistant STT) listener
      # WYOMING_HOST: 0.0.0.0   # narrow the Wyoming bind without moving the WebSocket
      # MAX_UPLOAD_MB: "200"    # /v1/audio/transcriptions upload ceiling
      # Host-RAM tuning. The Dockerfile ships sensible defaults (MALLOC_ARENA_MAX=2
      # and *_NUM_THREADS=2) that cut idle RSS by ~1 GB on a GPU box — see the
      # "Host-RAM tuning" note in the Dockerfile for why. Values set here override
      # those defaults, so uncomment and raise them if you run blurtd CPU-only or
      # want more CPU parallelism (at the cost of more resident memory):
      # MALLOC_ARENA_MAX: "2"        # glibc malloc arenas; higher = more RAM, less lock contention
      # OMP_NUM_THREADS: "2"         # torch/OpenMP CPU intra-op threads
      # MKL_NUM_THREADS: "2"         # Intel MKL BLAS threads
      # NUMEXPR_NUM_THREADS: "2"     # numexpr (pandas/librosa) threads
      # NUMBA_NUM_THREADS: "2"       # numba JIT (librosa resample) threads
    # The host resolves DNS via systemd-resolved's loopback stub (127.0.0.53),
    # which isn't reachable from inside a container — so set a real resolver here
    # or model downloads from huggingface.co fail with "name resolution" errors.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    # GPU access. Requires the NVIDIA Container Toolkit.
    gpus: all
    restart: unless-stopped

volumes:
  blurt-cache:
