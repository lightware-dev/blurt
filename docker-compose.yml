# blurtd — the Blurt dictation daemon.
#
#   docker compose up --build       # parakeet v3 multilingual on :25878
#
# Needs the NVIDIA Container Toolkit on the host (`--gpus all` equivalent).
services:
  blurtd:
    # Builds from this checkout. To run the published image instead, drop the
    # `build:` line and point `image:` at the registry:
    #
    #   image: ghcr.io/lightware-dev/blurt:latest
    #
    # Keep `build:` and Compose builds when the image is absent locally, which
    # would quietly rebuild rather than pull — so it's one or the other.
    build: .
    image: blurtd
    container_name: blurtd
    ports:
      - "25878:25878"
      # Wyoming protocol (Home Assistant STT) — disabled by default. To use it,
      # set WYOMING_PORT: "10300" below and uncomment this mapping. That port has
      # no auth and no TLS (AUTH_TOKEN does not apply to it), so only expose it
      # on a network you trust.
      # - "10300:10300"
    volumes:
      # Persists HuggingFace/NeMo model downloads *and* the auto-generated
      # self-signed TLS cert across restarts.
      - blurtd-cache:/home/blurt/.cache
      # Serves wss:// out of the box via an auto-generated cert. Mount your own
      # here to override it (see scripts/gen_certs.sh):
      # - ./certs:/app/certs:ro
    # All server config comes from a local `.env` (gitignored) — copy
    # `.env.example` to `.env` and uncomment what you need. It is optional: with
    # no `.env` the daemon runs its own defaults, which is the stock Parakeet
    # server on 0.0.0.0:25878.
    #
    #   BLURT_ASR_ENGINE=whisper   run Whisper instead of Parakeet (one or the
    #                              other; see WHISPER_MODEL, WHISPER_DTYPE,
    #                              WHISPER_LANGUAGE, WHISPER_TASK)
    #   AUTH_TOKEN=changeme        require ?token=… on the ws connection
    #   WYOMING_PORT=10300         enable the Wyoming (Home Assistant STT) listener
    #   HOST=…  PORT=…             move the bind (the published port above is
    #                              fixed at 25878, so change both together)
    #
    # The Dockerfile also ships host-RAM defaults (MALLOC_ARENA_MAX=2 and
    # *_NUM_THREADS=2) that cut idle RSS by ~1 GB on a GPU box — see the
    # "Host-RAM tuning" note there. Setting them in `.env` overrides those, so
    # raise them if you run blurtd CPU-only or want more CPU parallelism.
    env_file:
      - path: .env
        required: false
    # The host resolves DNS via systemd-resolved's loopback stub (127.0.0.53),
    # which isn't reachable from inside a container — so set a real resolver here
    # or model downloads from huggingface.co fail with "name resolution" errors.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    # GPU access. Requires the NVIDIA Container Toolkit.
    gpus: all
    restart: unless-stopped

volumes:
  blurtd-cache:
    # Pinned so Compose uses this exact name instead of prefixing it with the
    # project (which would make it "<dir>_blurtd-cache", i.e. a different name
    # depending on what the checkout directory is called). Matching the name
    # here to the one in the `docker run` examples means the docs can give one
    # volume name that is true either way — the mismatch cost an evening once.
    name: blurtd-cache
