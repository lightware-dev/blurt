name: Publish server image

# Builds the blurtd GPU image and pushes it to the GitHub Container Registry, so
# running the server doesn't require a checkout and a 20-minute local build:
#
#   docker run --gpus all -p 25878:25878 -v blurtd-cache:/home/blurt/.cache \
#       ghcr.io/lightware-dev/blurt:latest
#
# Tag policy:
#   v0.3 (release tag)  ->  :0.3  and  :latest
#   push to main        ->  :edge          (moving — what main builds right now)
#   pull request        ->  built, never pushed
#
# linux/amd64 only, deliberately: the image exists to run CUDA on an NVIDIA box,
# and the torch cu130 wheels it installs are x86_64 Linux. An arm64 variant would
# be a QEMU-emulated build of wheels that don't exist for that platform.
on:
    push:
        branches:
            - main
        tags:
            - 'v*'
        paths:
            - 'Dockerfile'
            - 'docker-entrypoint.sh'
            - '.dockerignore'
            - 'requirements.txt'
            - 'server/**'
            - 'static/**'
            - 'blurtd'
            - '.github/workflows/docker.yml'
    pull_request:
        # Narrower than the push filter on purpose. The build only *copies*
        # server/ and static/ — it never runs them — so a change there cannot
        # break the image, and server.yml already compiles and tests that code.
        # What can break the build is the recipe itself, so a PR only pays for a
        # rebuild when it touches one of these.
        paths:
            - 'Dockerfile'
            - 'docker-entrypoint.sh'
            - '.dockerignore'
            - 'requirements.txt'
            - '.github/workflows/docker.yml'
    workflow_dispatch:
        inputs:
            promote_digest:
                description: 'Promote an existing digest (sha256:…) instead of building. Empty = normal build.'
                required: false
                default: ''
            promote_tags:
                description: 'Comma-separated tags to point at that digest, e.g. 0.3,latest'
                required: false
                default: ''

# NOTE: path filters are ignored for tag pushes, so `v*` tags always run —
# exactly what we want for cutting a release.

# A newer commit supersedes an in-flight run on the same branch/PR. Tag refs are
# unique, so a release build is never cancelled by this.
concurrency:
    group: docker-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Point extra tags at an image that already exists, without rebuilding it.
    #
    # The point is to keep the *digest* identical, because the provenance
    # attestation is keyed by digest rather than by tag — so a tag that resolves
    # to the attested digest is covered, and one that doesn't is not verifiable
    # at all. A rebuild would produce a fresh digest for identical inputs and
    # split the attestation across two images.
    #
    # `docker buildx imagetools create` is the obvious tool here and is WRONG for
    # it: given a single source it builds a new image *index* wrapping that
    # manifest, which is a new digest. Tags made that way still pull fine (the
    # index resolves to the same image), so it looks correct — but
    # `gh attestation verify oci://…:<tag>` resolves the tag to the index digest,
    # finds no attestation for it, and fails. That is exactly how this shipped
    # once; the assertion at the end of the retag step is what makes a repeat
    # loud instead of silent.
    #
    # So the manifest is copied at the registry level: fetch the bytes by digest,
    # PUT the identical bytes under each new tag. A registry derives a manifest's
    # digest from its bytes, so unchanged bytes mean an unchanged digest.
    #
    # Two uses:
    #   - Backfilling a release whose tag predates this workflow — `v0.3` has no
    #     docker.yml in its tree, so it cannot be dispatched directly (a
    #     workflow_dispatch needs the file present on the ref it runs against).
    #   - Promoting a soaked :edge image to a release tag without rebuilding it,
    #     so what you ship is the artifact you actually tested.
    promote:
        if: github.event_name == 'workflow_dispatch' && inputs.promote_digest != ''
        runs-on: ubuntu-latest
        name: Promote an existing digest
        timeout-minutes: 10
        permissions:
            contents: read
            packages: write
        env:
            IMAGE: ghcr.io/${{ github.repository }}
        steps:
            - name: retag
              env:
                  DIGEST: ${{ inputs.promote_digest }}
                  TAGS: ${{ inputs.promote_tags }}
                  TOKEN_USER: ${{ github.actor }}
                  TOKEN_PASS: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  if [ -z "$TAGS" ]; then
                      echo "::error::promote_digest was given without promote_tags — nothing to point at it." >&2
                      exit 1
                  fi
                  case "$DIGEST" in
                      sha256:*) ;;
                      *) echo "::error::promote_digest must be a sha256:… digest, got '$DIGEST'." >&2; exit 1 ;;
                  esac

                  # GHCR path components must be lowercase. `tr` rather than
                  # ${VAR,,} so this stays runnable under bash 3.x (macOS), which
                  # is where it gets exercised outside CI.
                  REPO="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

                  TOKEN="$(curl -fsSL -u "${TOKEN_USER}:${TOKEN_PASS}" \
                      "https://ghcr.io/token?service=ghcr.io&scope=repository:${REPO}:pull,push" \
                      | jq -r .token)"

                  # Every manifest media type we might be promoting: a plain
                  # single-platform image today, an index if this ever goes
                  # multi-arch. Without these Accept headers the registry may hand
                  # back a converted manifest — different bytes, different digest.
                  ACCEPT='application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json'

                  HDR="$RUNNER_TEMP/headers.txt"
                  MAN="$RUNNER_TEMP/manifest.json"
                  # -f so a digest that isn't in this registry fails here, loudly.
                  curl -fsSL -D "$HDR" -o "$MAN" \
                      -H "Authorization: Bearer $TOKEN" -H "Accept: $ACCEPT" \
                      "https://ghcr.io/v2/${REPO}/manifests/${DIGEST}"

                  CT="$(tr -d '\r' < "$HDR" | awk 'tolower($1) == "content-type:" { print $2 }' | tail -1)"
                  if [ -z "$CT" ]; then
                      echo "::error::registry returned no Content-Type for ${DIGEST}." >&2
                      exit 1
                  fi
                  echo "manifest: $CT ($(wc -c < "$MAN") bytes)"

                  IFS=',' read -ra PARTS <<< "$TAGS"
                  APPLIED=()
                  for t in "${PARTS[@]}"; do
                      t="$(echo "$t" | tr -d '[:space:]')"
                      [ -n "$t" ] || continue
                      PUSHED="$(curl -fsSL -X PUT -D - -o /dev/null \
                          -H "Authorization: Bearer $TOKEN" -H "Content-Type: $CT" \
                          --data-binary "@$MAN" \
                          "https://ghcr.io/v2/${REPO}/manifests/${t}" \
                          | tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" { print $2 }' | tail -1)"
                      # The whole point of this job. If the registry stored
                      # something under a different digest then the tag is not
                      # covered by the attestation, and shipping it would be worse
                      # than not promoting at all.
                      if [ "$PUSHED" != "$DIGEST" ]; then
                          echo "::error::retagging ${t} changed the digest (${DIGEST} -> ${PUSHED:-unknown}) — tag would not be covered by the attestation." >&2
                          exit 1
                      fi
                      echo "${IMAGE}:${t} -> ${PUSHED}"
                      APPLIED+=("$t")
                  done

                  if [ ${#APPLIED[@]} -eq 0 ]; then
                      echo "::error::promote_tags contained no usable tag names." >&2
                      exit 1
                  fi

                  {
                      echo "### Promoted"
                      echo
                      echo "\`${IMAGE}@${DIGEST}\` is now also tagged:"
                      echo
                      for t in "${APPLIED[@]}"; do
                          echo "- \`${IMAGE}:${t}\`"
                      done
                      echo
                      echo "Digest preserved, so the existing provenance attestation covers all of them."
                  } >> "$GITHUB_STEP_SUMMARY"

    publish:
        # A dispatch that asks for a promotion must not also rebuild.
        if: github.event_name != 'workflow_dispatch' || inputs.promote_digest == ''
        runs-on: ubuntu-latest
        name: Build & push blurtd image
        # A cold build (nothing cached, both pip installs from scratch) measured
        # ~3 minutes on a hosted runner — the wheels download fast there. This
        # ceiling only trips on a hang.
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write # push the image to GHCR
            id-token: write # OIDC token the attestation is signed against
            attestations: write # write the SLSA provenance statement
        env:
            # GHCR rejects an uppercase path component; `lightware-dev/blurt` is
            # already lowercase, so github.repository can be used as-is. Rename
            # the repo to anything with a capital in it and this needs a
            # tr '[:upper:]' '[:lower:]' first.
            IMAGE: ghcr.io/${{ github.repository }}
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # No disk-freeing step here on purpose. This image is large (torch
            # plus its bundled CUDA/cuDNN runtime, NeMo, and the ASR tree), which
            # makes the usual "delete the Android SDK and dotnet" preamble look
            # necessary — it isn't. A hosted ubuntu-24 runner reports 145 GB with
            # ~88 GB free before anything is removed, and a measured cold build of
            # this Dockerfile finishes with room to spare. The preamble cost ~90 s
            # of every run to free space nothing was short of.
            - name: set up buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

            # Skipped on pull requests: nothing is pushed there, and a PR from a
            # fork gets a read-only GITHUB_TOKEN that cannot log in anyway.
            - name: log in to GHCR
              if: github.event_name != 'pull_request'
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: image tags and labels
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ env.IMAGE }}
                  # `type=semver` would be wrong here: releases are tagged `v0.3`,
                  # and a two-component version is not valid semver, so semver
                  # parsing drops it and the release would publish no version tag
                  # at all — silently, with the workflow still green. `type=match`
                  # runs a plain regex over the tag name instead:
                  #   v0.3    -> 0.3         (+ latest)
                  #   v0.3.1  -> 0.3.1, 0.3  (+ latest)
                  # The three-component pattern simply doesn't match a `v0.3` tag,
                  # and duplicate tags across the two lines are de-duplicated.
                  tags: |
                      type=match,pattern=v(\d+\.\d+\.\d+),group=1
                      type=match,pattern=v(\d+\.\d+),group=1
                      type=raw,value=edge,enable={{is_default_branch}}
                      type=ref,event=pr
                  # latest=auto applies :latest on tag pushes only — never on main,
                  # which gets :edge instead.
                  flavor: latest=auto
                  labels: |
                      org.opencontainers.image.title=blurtd
                      org.opencontainers.image.description=Blurt — local-only Parakeet streaming ASR server for dictation (NVIDIA GPU)
                      org.opencontainers.image.licenses=Apache-2.0
                      org.opencontainers.image.documentation=https://github.com/lightware-dev/blurt#docker

            - name: build and push
              id: build
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  platforms: linux/amd64
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  annotations: ${{ steps.meta.outputs.annotations }}
                  # Reuse the previous main build's layers. The expensive part is
                  # the two pip installs, which only change when requirements.txt
                  # or the python:3.12-slim-bookworm base does — so a server/-only
                  # push rebuilds the last few COPY layers in a couple of minutes
                  # instead of twenty. `type=inline` writes the cache manifest into
                  # the image's own config, so it costs no extra registry storage,
                  # and a cache *import* miss (the very first build, or while the
                  # package is still private) is a warning rather than a failure.
                  cache-from: type=registry,ref=${{ env.IMAGE }}:edge
                  cache-to: type=inline
                  # BuildKit's own provenance/SBOM attestations turn a
                  # single-platform push into a manifest *list* carrying an
                  # `unknown/unknown` entry, which is what makes GHCR's package
                  # page and `docker manifest inspect` show a phantom platform. We
                  # publish provenance separately below instead, in the same signed
                  # form the macOS and Windows release artifacts already use.
                  provenance: false
                  sbom: false

            # Binds the image digest to the repo, workflow and commit that produced
            # it — the container-registry counterpart of the attestation mac.yml
            # and windows.yml attach to their zips. Consumers verify with:
            #   gh attestation verify oci://ghcr.io/lightware-dev/blurt:0.3 \
            #       --repo lightware-dev/blurt
            #
            # push-to-registry stores the statement alongside the image in GHCR, so
            # verification needs the registry rather than a GitHub Release asset.
            - name: attest build provenance
              if: github.event_name != 'pull_request'
              uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
              with:
                  subject-name: ${{ env.IMAGE }}
                  subject-digest: ${{ steps.build.outputs.digest }}
                  push-to-registry: true

            - name: summary
              if: github.event_name != 'pull_request'
              env:
                  TAGS: ${{ steps.meta.outputs.tags }}
                  DIGEST: ${{ steps.build.outputs.digest }}
              run: |
                  set -euo pipefail
                  {
                      echo "### Published"
                      echo
                      echo '```'
                      printf '%s\n' "$TAGS"
                      echo '```'
                      echo
                      echo "Digest: \`$DIGEST\`"
                  } >> "$GITHUB_STEP_SUMMARY"
