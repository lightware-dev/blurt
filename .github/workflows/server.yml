name: Test server

# Runs the protocol regression suite (scripts/test_protocol.py) against the real
# server over real sockets: the native WebSocket protocol, the Wyoming listener
# (including a round trip driven by the official `wyoming` client library that
# Home Assistant uses), the OpenAI-compatible /v1 API, and PCM conversion.
#
# No GPU and no model download: the suite stubs the ASR engine and the Silero
# VAD, so it installs requirements-test.txt (a handful of small wheels) rather
# than torch + NeMo, and finishes in well under a minute.
#
# Path-filtered to the server and its tests so client/www-only pushes don't
# trigger it. The Mac and Windows clients are compiled by mac.yml / windows.yml.
on:
    push:
        branches:
            - main
        tags:
            - 'v*'
        paths:
            - 'server/**'
            - 'scripts/test_protocol.py'
            - 'requirements.txt'
            - 'requirements-test.txt'
            - 'requirements-test.in'
            - '.github/workflows/server.yml'
    pull_request:
        paths:
            - 'server/**'
            - 'scripts/test_protocol.py'
            - 'requirements.txt'
            - 'requirements-test.txt'
            - 'requirements-test.in'
            - '.github/workflows/server.yml'
    workflow_dispatch:

# A newer commit supersedes an in-flight run on the same branch/PR.
concurrency:
    group: test-server-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test-server:
        runs-on: ubuntu-latest
        name: Protocol suite (Python ${{ matrix.python-version }})
        # The suite drives real sockets with real timing; well under a minute in
        # practice, so this only trips if something hangs.
        timeout-minutes: 10
        strategy:
            # Report every version's result, not just the first failure.
            fail-fast: false
            matrix:
                # 3.12 matches the Dockerfile; the neighbours guard against
                # version-specific asyncio behaviour (server shutdown, in
                # particular, differs across these).
                python-version: ['3.11', '3.12', '3.13']
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: setup Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip
                  cache-dependency-path: requirements-test.txt

            # --require-hashes: every pin in requirements-test.txt carries its
            # artifact hashes, so a tampered-with or re-uploaded wheel fails the
            # install rather than running in CI. Edit requirements-test.in and
            # recompile (see the header of the lockfile) to change anything.
            - name: install test deps
              run: |
                  python -m pip install --upgrade pip
                  pip install --require-hashes -r requirements-test.txt

            - name: byte-compile every module
              # Catches syntax errors in files the suite never imports (the CLI
              # entrypoint, the helper scripts) before the slower tests run.
              run: python -m compileall -q server scripts

            - name: protocol suite
              run: python scripts/test_protocol.py
