name: Deploy website

# Builds the Next.js site with OpenNext and deploys it to the Cloudflare Worker
# named "blurt" (see www/wrangler.toml). Runs on push to main, but only when
# something under www/ (or this workflow) changed, so server/client-only pushes
# don't trigger a redeploy. Also runnable on demand via the Actions tab.
#
# Requires two repo secrets:
#   CLOUDFLARE_API_TOKEN   — token with the "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID  — the account the Worker lives in
# wrangler (invoked by `opennextjs-cloudflare deploy`) reads both from the env.
on:
    push:
        branches:
            - main
        paths:
            - 'www/**'
            - '.github/workflows/www.yml'
    workflow_dispatch:

# Never let two deploys race; cancel an in-flight run if a newer commit lands.
concurrency:
    group: deploy-www
    cancel-in-progress: true

jobs:
    deploy-www:
        runs-on: ubuntu-latest
        name: Build & deploy to Cloudflare
        defaults:
            run:
                working-directory: www
        steps:
            - name: checkout
              uses: actions/checkout@v5

            - name: setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: www/package-lock.json

            - name: install deps
              run: npm ci

            - name: build & deploy
              run: npm run deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
