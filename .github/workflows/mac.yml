name: Build macOS app

# Builds Blurt in release configuration and publishes the .app as a downloadable zip.
# When the Developer ID + notary secrets are present (push to main / tag / manual run) the
# build is signed + notarized + stapled; otherwise (PRs, forks) it falls back to an ad-hoc
# signature so the build still verifies. Pushing a `v*` tag additionally publishes a GitHub
# Release with the zip attached.
#
# Path-filtered to `clients/mac/**` so it doesn't burn (10x-priced) macOS runner minutes on
# server/www-only pushes. NOTE: path filters are ignored for tag pushes, so `v*` tags always
# run — exactly what we want for cutting a release.
on:
    push:
        branches:
            - main
        tags:
            - 'v*'
        paths:
            - 'clients/mac/**'
            - '.github/workflows/mac.yml'
    pull_request:
        paths:
            - 'clients/mac/**'
            - '.github/workflows/mac.yml'
    workflow_dispatch:

jobs:
    build-mac:
        # macos-26, not macos-15: the on-device engine (LocalEngine.swift) needs
        # the macOS 26 SDK. The macos-15 image does carry it — Xcode 26.x ships
        # alongside the default 16.4, and the step below picks the newest — so
        # this build worked there too. But that's incidental: it depends on a
        # Sequoia image continuing to bundle a Tahoe Xcode, which is not a
        # promise anyone made. Pinning the runner makes the SDK a property of
        # the image instead of a lucky draw, and macos-15 is on its way out.
        #
        # The deployment target stays 13.0 — the Speech symbols are behind
        # #available, so the universal build still runs on older macOS.
        runs-on: macos-26
        name: Build & package Blurt (release)
        permissions:
            contents: write # needed to publish a GitHub Release on tag pushes
            id-token: write # OIDC token the attestation is signed against
            attestations: write # write the SLSA provenance statement
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # Inlined instead of using a third-party action: every action in this job
            # runs alongside the Developer ID key, the notary key and HOMEBREW_TAP_TOKEN,
            # so the fewer that live here the better. Runner images ship each toolchain
            # as /Applications/Xcode_<version>.app, with prereleases suffixed _beta.
            - name: select latest stable Xcode
              run: |
                  set -euo pipefail
                  XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v beta | sort -V | tail -1 || true)"
                  if [ -z "$XCODE" ]; then
                      echo "::error::No stable /Applications/Xcode_*.app on the runner — image layout changed." >&2
                      exit 1
                  fi
                  sudo xcode-select -s "$XCODE/Contents/Developer"

            - name: toolchain versions
              run: |
                  swift --version
                  xcodebuild -version

            # Signed+notarized only when secrets exist AND this isn't a PR (notarization is
            # slow + hits Apple's service, so PRs just do an ad-hoc build to verify it compiles).
            - name: determine build mode
              id: cfg
              env:
                  P12: ${{ secrets.DEVID_CERT_P12_BASE64 }}
              run: |
                  set -euo pipefail
                  if [ -n "$P12" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
                      echo "signed=true" >> "$GITHUB_OUTPUT"
                      echo "Developer ID secrets present -> signed + notarized build"
                  else
                      echo "signed=false" >> "$GITHUB_OUTPUT"
                      echo "No secrets or PR build -> ad-hoc signature"
                  fi
                  if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
                      echo "release=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "release=false" >> "$GITHUB_OUTPUT"
                  fi

            # Fail fast: never publish an un-notarized build as a Release, and keep the tag in
            # lockstep with the bundle version so the zip name matches the release.
            - name: guard release preconditions
              if: steps.cfg.outputs.release == 'true'
              run: |
                  set -euo pipefail
                  if [ "${{ steps.cfg.outputs.signed }}" != "true" ]; then
                      echo "::error::Release tag pushed but signing secrets are missing — refusing to publish an un-notarized build." >&2
                      exit 1
                  fi
                  VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' clients/mac/Info.plist)"
                  if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
                      echo "::error::Tag $GITHUB_REF_NAME does not match bundle version v$VERSION (set CFBundleShortVersionString in clients/mac/Info.plist)." >&2
                      exit 1
                  fi

            # ---- signed + notarized path ----
            - name: import Developer ID certificate
              if: steps.cfg.outputs.signed == 'true'
              id: cert
              env:
                  P12_BASE64: ${{ secrets.DEVID_CERT_P12_BASE64 }}
                  P12_PASSWORD: ${{ secrets.DEVID_CERT_PASSWORD }}
                  KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
              run: |
                  set -euo pipefail
                  KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
                  security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
                  security set-keychain-settings -lut 3600 "$KEYCHAIN"
                  security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
                  printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/devid.p12"
                  security import "$RUNNER_TEMP/devid.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
                  # Allow codesign to use the key non-interactively.
                  security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
                  # Prepend our keychain to the search list so codesign finds the identity.
                  security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
                  IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
                  echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
                  rm -f "$RUNNER_TEMP/devid.p12"

            - name: write notary API key
              if: steps.cfg.outputs.signed == 'true'
              env:
                  P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
              run: printf '%s' "$P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"

            - name: build, sign, notarize, staple
              if: steps.cfg.outputs.signed == 'true'
              working-directory: clients/mac
              env:
                  SIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
                  NOTARY_KEY: ${{ runner.temp }}/notary.p8
                  NOTARY_KEY_ID: ${{ vars.NOTARY_KEY_ID }}
                  NOTARY_ISSUER: ${{ vars.NOTARY_ISSUER_ID }}
              run: ./notarize.sh

            # ---- ad-hoc fallback (no secrets / PR) ----
            - name: build (ad-hoc)
              if: steps.cfg.outputs.signed == 'false'
              working-directory: clients/mac
              run: |
                  set -euo pipefail
                  ./build-app.sh
                  VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Blurt.app/Contents/Info.plist)"
                  mkdir -p dist
                  ditto -c -k --keepParent Blurt.app "dist/Blurt-${VERSION}-macOS.zip"

            # ---- common: resolve + upload ----
            - name: resolve artifact
              id: artifact
              run: |
                  set -euo pipefail
                  ZIP="$(ls clients/mac/dist/*.zip | head -1)"
                  echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
                  echo "name=$(basename "${ZIP%.zip}")-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

            # Binds this artifact's digest to the repo, workflow and commit that
            # produced it. Notarization proves Apple saw the binary and that it
            # carries our Developer ID; it says nothing about which source tree it
            # was built from, and a checksum only proves the file didn't change in
            # transit. Consumers verify with:
            #   gh attestation verify Blurt-macOS.zip --repo lightware-dev/blurt
            #
            # Only on release tags: attestation is about what we publish, and a PR
            # build isn't published. The version-less Blurt-macOS.zip copy needs no
            # separate attestation — it's byte-identical, and attestations are keyed
            # by digest rather than by filename.
            #
            # Caveat worth knowing: this attests the bytes *this run* built. On a
            # re-run where the release already carries an earlier attempt's asset,
            # the upload step deliberately leaves the published file untouched (see
            # below) and a macOS rebuild is never byte-identical — fresh codesign
            # timestamp, new notarization ticket. The attestation would then cover a
            # digest that isn't the published one. Same failure mode the cask bump
            # already guards against; if it bites, delete the asset and re-run clean.
            - name: attest build provenance
              if: steps.cfg.outputs.release == 'true'
              uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
              with:
                  subject-path: ${{ steps.artifact.outputs.zip }}

            - name: clean up signing keychain
              if: always() && steps.cfg.outputs.signed == 'true'
              run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

            - name: upload artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ${{ steps.artifact.outputs.name }}
                  path: ${{ steps.artifact.outputs.zip }}
                  if-no-files-found: error
                  retention-days: 30

            # ---- release: attach the notarized zip to a GitHub Release ----
            - name: publish GitHub Release
              if: steps.cfg.outputs.release == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  ZIP="${{ steps.artifact.outputs.zip }}"
                  # A stable, version-less copy so the website can link a fixed URL:
                  #   https://github.com/${{ github.repository }}/releases/latest/download/Blurt-macOS.zip
                  cp "$ZIP" "clients/mac/dist/Blurt-macOS.zip"
                  # The macOS and Windows workflows target the same v* tag + release,
                  # so creation must be idempotent — whichever job runs second just
                  # uploads its assets to the already-created release.
                  #
                  # Check-then-create is NOT idempotent: both jobs start on the same
                  # tag push, both see no release, both call create, and one gets a
                  # 422. Under `set -e` that killed this job before it uploaded, while
                  # pwsh silently ignored it on the Windows side — same race, red mac,
                  # green windows. So: attempt creation, and treat "it exists now" as
                  # success regardless of who won.
                  if ! gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                          --title "Blurt $GITHUB_REF_NAME" --generate-notes; then
                      if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                          echo "::notice::release $GITHUB_REF_NAME already exists — the Windows job created it first"
                      else
                          echo "::error::could not create release $GITHUB_REF_NAME, and it does not exist" >&2
                          exit 1
                      fi
                  fi
                  # Deliberately no --clobber: a published asset is never replaced in
                  # place. This is defence in depth against an *accidental* overwrite —
                  # a re-run, or a tag pushed twice — not a control on a leaked
                  # contents:write token, which can delete and re-upload through the API
                  # without going near this workflow. What actually defends against that
                  # is signing (the updater refusing anything not signed by us) and build
                  # provenance.
                  #
                  # Skip-if-present rather than failing on a conflict: the cask bump below
                  # is a plausible failure point, and a re-run has to be able to get past
                  # an already-uploaded asset to reach it. Failing here would mean hand-
                  # deleting published assets just to retry — the very operation we're
                  # trying to keep rare.
                  ASSETS="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                      --json assets --jq '.assets[].name')"
                  for f in "$ZIP" "clients/mac/dist/Blurt-macOS.zip"; do
                      if printf '%s\n' "$ASSETS" | grep -qxF "$(basename "$f")"; then
                          echo "::notice::$(basename "$f") is already published — leaving it untouched"
                      else
                          gh release upload "$GITHUB_REF_NAME" "$f" --repo "$GITHUB_REPOSITORY"
                      fi
                  done

            # ---- release: bump the Homebrew cask in lightware-dev/homebrew-tap ----
            # Point the cask at the just-published notarized zip. The versioned asset
            # name (Blurt-<version>-macOS.zip) matches the url template in the cask, so
            # we only rewrite the `version` and `sha256` lines. Needs HOMEBREW_TAP_TOKEN:
            # a PAT (or fine-grained token) with contents:write on the tap repo.
            - name: bump Homebrew cask
              if: steps.cfg.outputs.release == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
              run: |
                  set -euo pipefail
                  VERSION="${GITHUB_REF_NAME#v}"

                  # Hash what the release actually carries, not what this run built.
                  # The upload above skips assets that are already published, and a
                  # rebuild is never byte-identical to an earlier one: codesign embeds a
                  # fresh Apple timestamp, stapling embeds a newly-issued notarization
                  # ticket, ditto records new mtimes. So on a re-run (say the push below
                  # failed the first time and the operator hit "Re-run failed jobs") the
                  # local zip and the published one differ, and hashing the local one
                  # would point the cask at a file whose checksum can never match —
                  # breaking `brew install` for everyone, with the workflow still green.
                  PUB="$RUNNER_TEMP/published"
                  mkdir -p "$PUB"
                  gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                      --pattern "Blurt-${VERSION}-macOS.zip" --dir "$PUB" --clobber
                  SHA="$(shasum -a 256 "$PUB/Blurt-${VERSION}-macOS.zip" | awk '{print $1}')"

                  # Loud when the release is carrying a build other than this run's —
                  # correct, but the operator should know the tag and the artifacts in
                  # this run's logs are not the same bytes.
                  LOCAL_SHA="$(shasum -a 256 "${{ steps.artifact.outputs.zip }}" | awk '{print $1}')"
                  if [ "$SHA" != "$LOCAL_SHA" ]; then
                      echo "::notice::published asset predates this run — casking the published bytes ($SHA), not this run's rebuild ($LOCAL_SHA)"
                  fi

                  git clone --depth 1 \
                      "https://x-access-token:${TAP_TOKEN}@github.com/lightware-dev/homebrew-tap.git" tap
                  CASK="tap/Casks/blurt.rb"
                  /usr/bin/sed -i '' -E "s/^  version \".*\"/  version \"${VERSION}\"/" "$CASK"
                  /usr/bin/sed -i '' -E "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" "$CASK"

                  cd tap
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  if git diff --quiet; then
                      echo "cask already at ${VERSION} — nothing to push"
                      exit 0
                  fi
                  git add Casks/blurt.rb
                  git commit -m "blurt ${VERSION}"
                  git push
