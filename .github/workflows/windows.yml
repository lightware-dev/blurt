name: Build Windows app

# Builds Blurt for Windows as a single self-contained Blurt.exe and publishes it as
# a downloadable zip — the Windows twin of mac.yml. Pushing a `v*` tag additionally
# publishes a GitHub Release with the zip attached.
#
# WINDOWS BUILDS ARE NOT SIGNED. There is no Authenticode certificate, so users
# get a SmartScreen warning on first launch. This file used to carry a `sign exe`
# step gated on a WINDOWS_CERT_PFX_BASE64 secret that was never set: it had never
# run, every release we have ever shipped was unsigned, and the config read as
# though the opposite were true. That was not a cosmetic problem — a security
# review of this repo produced an unshippable recommendation off the back of it
# ("verify the extracted exe's Authenticode signature before ApplyUpdate"), which
# would have rejected every genuine update. So the step is gone rather than left
# looking load-bearing; see #9.
#
# What the artifacts do carry is a signed build provenance attestation (#24):
#   gh attestation verify Blurt-Windows.zip --repo lightware-dev/blurt
#
# To add real signing, restore a `sign exe` step *and* provision the secrets in
# the same change — and put them in an Environment scoped to main/v* (#20) rather
# than at repo scope. Note what signing does not buy: this workflow signs on any
# push to main and any v* tag, so anyone with write access can have CI sign their
# payload. It defends a release asset replaced *without* a code push.
#
# Path-filtered to clients/windows/** so it doesn't run on server/www-only pushes.
# NOTE: path filters are ignored for tag pushes, so `v*` tags always run — exactly
# what we want for cutting a release.
on:
    push:
        branches:
            - main
        tags:
            - 'v*'
        paths:
            - 'clients/windows/**'
            - '.github/workflows/windows.yml'
    pull_request:
        paths:
            - 'clients/windows/**'
            - '.github/workflows/windows.yml'
    workflow_dispatch:

jobs:
    build-windows:
        runs-on: windows-latest
        name: Build & package Blurt (release)
        permissions:
            contents: write # needed to publish a GitHub Release on tag pushes
            id-token: write # OIDC token the attestation is signed against
            attestations: write # write the SLSA provenance statement
        defaults:
            run:
                shell: pwsh
                working-directory: clients/windows
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: setup .NET 8
              uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
              with:
                  dotnet-version: '8.0.x'

            - name: toolchain versions
              run: dotnet --info

            # Read the version from the csproj so the artifact name + release tag guard
            # stay in lockstep (mirrors the Mac Info.plist version check).
            - name: read version
              id: ver
              run: |
                  [xml]$proj = Get-Content Blurt.csproj
                  $v = ($proj.Project.PropertyGroup.Version | Where-Object { $_ }) | Select-Object -First 1
                  if (-not $v) { Write-Error 'No <Version> in Blurt.csproj'; exit 1 }
                  "version=$v" >> $env:GITHUB_OUTPUT
                  "Version: $v"

            - name: determine build mode
              id: cfg
              run: |
                  $release = "$env:GITHUB_REF".StartsWith('refs/tags/v')
                  "release=$($release.ToString().ToLower())" >> $env:GITHUB_OUTPUT

            # Fail fast: keep the tag in lockstep with the assembly version so the zip
            # name matches the release (mirrors the Mac guard).
            - name: guard release preconditions
              if: steps.cfg.outputs.release == 'true'
              run: |
                  if ("$env:GITHUB_REF_NAME" -ne "v${{ steps.ver.outputs.version }}") {
                      Write-Error "Tag $env:GITHUB_REF_NAME does not match version v${{ steps.ver.outputs.version }} (set <Version> in clients/windows/Blurt.csproj)."
                      exit 1
                  }

            - name: restore
              run: dotnet restore

            # Single-file, self-contained x64 build — no .NET runtime needed on the
            # target machine. Produces publish/Blurt.exe.
            - name: publish
              run: >
                  dotnet publish Blurt.csproj
                  -c Release
                  -r win-x64
                  --self-contained true
                  -p:PublishSingleFile=true
                  -p:IncludeNativeLibrariesForSelfExtract=true
                  -p:EnableCompressionInSingleFile=true
                  -o publish

            - name: package zip
              id: artifact
              run: |
                  $ver = "${{ steps.ver.outputs.version }}"
                  New-Item -ItemType Directory -Force dist | Out-Null
                  $zip = "dist/Blurt-$ver-Windows.zip"
                  Compress-Archive -Path publish/Blurt.exe -DestinationPath $zip -Force
                  "zip=clients/windows/$zip" >> $env:GITHUB_OUTPUT
                  $sha = "$env:GITHUB_SHA".Substring(0,7)
                  "name=Blurt-$ver-Windows-$sha" >> $env:GITHUB_OUTPUT

            # Binds this artifact's digest to the repo, workflow and commit that
            # produced it:
            #   gh attestation verify Blurt-Windows.zip --repo lightware-dev/blurt
            #
            # Carries more weight here than on macOS, because Windows releases are
            # unsigned (#9) — this is currently the only cryptographic link between
            # a downloaded zip and this repository. It is not a substitute for
            # signing: it defends a release asset replaced *without* a code push,
            # not an attacker with repo write access, who can push a tag and have CI
            # attest their payload just as readily.
            #
            # Release tags only; a PR build isn't published. The version-less
            # Blurt-Windows.zip copy is byte-identical and attestations are keyed by
            # digest, so one statement covers both.
            - name: attest build provenance
              if: steps.cfg.outputs.release == 'true'
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-path: ${{ steps.artifact.outputs.zip }}

            - name: upload artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ${{ steps.artifact.outputs.name }}
                  path: ${{ steps.artifact.outputs.zip }}
                  if-no-files-found: error
                  retention-days: 30

            # ---- release: attach the zip to a GitHub Release ----
            - name: publish GitHub Release
              if: steps.cfg.outputs.release == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              working-directory: clients/windows
              run: |
                  # pwsh does not stop on a native command's non-zero exit by
                  # default, which is how a failed `gh release create` used to be
                  # swallowed here — the job carried on and went green while the
                  # macOS job died on the identical failure. Stop on both.
                  $ErrorActionPreference = 'Stop'
                  $PSNativeCommandUseErrorActionPreference = $true

                  $zip = "dist/Blurt-${{ steps.ver.outputs.version }}-Windows.zip"
                  # A stable, version-less copy so the website can link a fixed URL:
                  #   https://github.com/${{ github.repository }}/releases/latest/download/Blurt-Windows.zip
                  Copy-Item $zip "dist/Blurt-Windows.zip"

                  # The macOS and Windows workflows target the same v* tag + release,
                  # so creation must be idempotent — whichever job runs second just
                  # uploads its assets to the already-created release.
                  #
                  # Check-then-create is NOT idempotent: both jobs start on the same
                  # tag push, both see no release, both call create, and one gets a
                  # 422. Attempt creation instead, and treat "it exists now" as
                  # success regardless of which platform won the race.
                  try {
                      gh release create "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" `
                          --title "Blurt $env:GITHUB_REF_NAME" --generate-notes
                  } catch {
                      $exists = $false
                      try {
                          gh release view "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" | Out-Null
                          $exists = $true
                      } catch { }
                      if ($exists) {
                          Write-Output "::notice::release $env:GITHUB_REF_NAME already exists — the macOS job created it first"
                      } else {
                          Write-Error "could not create release $env:GITHUB_REF_NAME, and it does not exist"
                      }
                  }
                  # Deliberately no --clobber: a published asset is never replaced in
                  # place. This is defence in depth against an *accidental* overwrite —
                  # a re-run, or a tag pushed twice — not a control on a leaked
                  # contents:write token, which can delete and re-upload through the API
                  # without going near this workflow. What defends against that here is
                  # the build provenance attestation below — and only that, since these
                  # builds are unsigned (see the header comment and #9).
                  #
                  # Skip-if-present rather than failing on a conflict, so a re-run of a
                  # partially-completed release isn't wedged behind hand-deleting the
                  # assets it already uploaded.
                  # @(...) forces an array even when the release has zero or one asset,
                  # so -contains behaves the same in all three cases.
                  $published = @(gh release view "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" `
                      --json assets --jq '.assets[].name' | ForEach-Object { $_.Trim() })
                  foreach ($f in @($zip, "dist/Blurt-Windows.zip")) {
                      $name = Split-Path $f -Leaf
                      if ($published -contains $name) {
                          Write-Output "::notice::$name is already published — leaving it untouched"
                      } else {
                          # No explicit $LASTEXITCODE check: with
                          # $PSNativeCommandUseErrorActionPreference set above, a
                          # non-zero exit from gh throws and fails the step.
                          gh release upload "$env:GITHUB_REF_NAME" $f --repo "$env:GITHUB_REPOSITORY"
                      }
                  }
