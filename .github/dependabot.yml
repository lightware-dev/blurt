# Workflow actions are pinned to full commit SHAs (see .github/workflows/*.yml), which
# stops a retagged upstream from executing in jobs that hold our signing keys — but it
# also means pins never move on their own. Dependabot bumps the SHA and the trailing
# version comment together, so updates stay reviewable instead of silently rotting.
version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          # One PR for all of them; these bump together and are reviewed as a set.
          actions:
              patterns:
                  - '*'

    # The website. Grouped minor+patch so routine Next/wrangler drift is one PR;
    # majors arrive individually because those are the ones that need reading.
    #
    # Watch the `overrides` block in www/package.json when reviewing these: it
    # pins postcss and sharp above what next ships, and a next bump that finally
    # carries the patched versions is the signal to drop the entry rather than
    # to keep overriding. brace-expansion is deliberately left un-overridden
    # there — see the note in package.json before "fixing" it.
    - package-ecosystem: npm
      directory: /www
      schedule:
          interval: weekly
      open-pull-requests-limit: 3
      groups:
          www-minor-and-patch:
              update-types:
                  - minor
                  - patch

    # The Windows client (clients/windows/Blurt.csproj).
    - package-ecosystem: nuget
      directory: /clients/windows
      schedule:
          interval: weekly
      open-pull-requests-limit: 3
      groups:
          windows-minor-and-patch:
              update-types:
                  - minor
                  - patch

    # The server. Both requirements.txt and requirements-test.txt are now fully
    # pinned with hashes, so there is something concrete for Dependabot to bump.
    #
    # Read the first PR from this entry carefully rather than merging on green.
    # Both lockfiles are generated (requirements.in + scripts/lock-requirements.sh)
    # and carry a `uv pip compile` header; Dependabot's pip-compile support keys
    # off the pip-tools header, so it may well edit requirements.txt directly
    # instead of regenerating it. If it does, the file drifts from its source and
    # the right move is to close the PR and re-run the script by hand.
    #
    # It must also never bump torch: the pin in requirements.in only tells the
    # resolver which torch the cu130 step installs, and moving it here without
    # moving the Dockerfile would pin the whole tree against a torch that is
    # never present.
    - package-ecosystem: pip
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 3
      ignore:
          - dependency-name: torch
      groups:
          server-minor-and-patch:
              update-types:
                  - minor
                  - patch

# Deliberately absent:
#
#   swift — Dependabot has no Swift/SPM support, so clients/mac is unmanaged.
